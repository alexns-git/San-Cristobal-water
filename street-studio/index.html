.lane-viewport .strip .stwidth{color:#1e3330;background:#fffef2ee;text-shadow:none}
.lane-palette-choice{border-color:#bfcac0}
.lane-palette-symbol{box-shadow:inset 0 0 0 1px #26383128}

.lane-plants{margin-top:12px;padding-top:12px;border-top:1px solid #d9e2d7}
.lane-plants .chips{gap:6px}.lane-plants .chip{font-size:14px;padding:10px 11px;min-height:42px;justify-content:center;flex:1}
.plant-choice-group{margin-top:13px}.plant-choice-group .field{margin:4px 0 8px}
.plant-choice-group .form-label{font-size:14px;margin:5px 0}
.plant-species-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.plant-species{display:flex;align-items:center;gap:5px;min-height:44px;border:1px solid #cdd9ca;background:#fff;border-radius:10px;padding:7px 8px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer}
.plant-species.on{background:#e3eee0;border-color:#689a78}
.plant-species input{width:17px;height:17px;margin:0 3px 0 0;accent-color:var(--green);flex:none}
.plant-species span{font-size:15px}

    if(['traffic','bus'].includes(lane.kind)){for(let z=3;z<LENGTH;z+=8)rect(xx+.03,xx+.1,z,z+3,.053,'#eee9dc')}
    if(lane.kind==='tram'){for(let off of [-.62,.62])rect((xx+x2)/2+off-.035,(xx+x2)/2+off+.035,0,LENGTH,.06,'#687270')}
    if(lane.kind==='parking'){for(let z=2;z<LENGTH;z+=7)rect(xx,x2,z,z+.06,.052,'#eee7d9')}
    if(lane.kind==='planting'){const plant=lane.planting;const crossings=data.planting;const close=z=>crossings.crossingsEnabled!==false&&Array.from({length:Math.ceil(LENGTH/crossings.crossingEvery)},(_,k)=>crossings.crossingEvery*(k+.5)).some(t=>Math.abs(t-z)<3.8);
    if(plant.mode!=='shrubs'&&plant.trees.length)for(let z=plant.treeEvery*.65+(i%2)*plant.treeEvery*.38;z<LENGTH;z+=plant.treeEvery){if(close(z))continue;const type=plant.trees[(Math.floor(z/plant.treeEvery)+i)%plant.trees.length];tree((xx+x2)/2,z,type)}
    if(plant.mode!=='trees'&&plant.shrubs.length)for(let z=plant.shrubEvery*.55;z<LENGTH;z+=plant.shrubEvery){if(close(z))continue;if(plant.mode==='mixed'&&plant.trees.length&&Math.abs(z%plant.treeEvery-plant.treeEvery*.65)<.58)continue;shrub((xx+x2)/2,z,plant.shrubs[(Math.floor(z/plant.shrubEvery)+i)%plant.shrubs.length])}}
    if(lane.kind==='traffic'||lane.kind==='parking'){for(let z=11+(i%3)*6;z<LENGTH;z+=lane.kind==='parking'?14:39)if(!nearCross(z,2))vehicle((xx+x2)/2,z,lane.kind==='parking'?3.2:3.8,false)}
    if(lane.kind==='bus'){for(let z=16;z<LENGTH;z+=50)if(!nearCross(z,5))vehicle((xx+x2)/2,z,8,true)}
    if(lane.kind==='tram')if(!nearCross(17,8))vehicle((xx+x2)/2,17,15,true);
    xx=x2});
  if(data.planting.crossingsEnabled!==false&&data.planting.crossingEvery){let n=data.planting.crossingEvery;for(let z=n/2;z<LENGTH;z+=n){let x=half;for(const l of data.lanes){if(l.kind==='planting')rect(x,x-l.w,z-2,z+2,.145,'#e2ded1');else if(l.kind!=='pavement')for(let q=-1.7;q<2;q+=.9)rect(x-.07,x-l.w+.07,z+q,z+q+.47,.12,'#f6f0e5');x-=l.w}}}
  for(const which of ['left','right']){let z=0,sign=which==='left'?1:-1,edge=half*sign;for(const p of data.frontages[which]){const width=p.w,kind=p.kind,z1=z+.08,z2=z+width-.08;const b=BLD[kind];if(kind==='alley'){rect(edge,edge+sign*11,z1,z2,.02,'#b8b9ac');z+=width;continue}if(kind==='open'){rect(edge,edge+sign*11,z1,z2,.035,'#93ba8a');for(let k=0;k<3;k++)shrub(edge+sign*2.8,z1+(k+.5)*(z2-z1)/3,'box');z+=width;continue}
      const front=edge+sign*p.setback,outer=front+sign*BUILDING_DEPTH,height=p.stories*STOREY_HEIGHT,wall='#'+b.wall.toString(16).padStart(6,'0'),roof='#'+b.roof.toString(16).padStart(6,'0');
      if(p.setback>0){rect(edge,front,z1,z2,.045,kind==='office'||kind==='warehouse'||kind==='haussmann'?'#c5c2b4':'#99b486');if(kind!=='office'&&kind!=='warehouse')for(let k=0;k<2;k++)shrub(edge+sign*Math.min(1.0,p.setback*.6),z1+(k+.5)*(z2-z1)/2,'box')}
      cuboid(Math.min(front,outer),Math.max(front,outer),.13,height,z1,z2,wall,kind==='office'?'#7c9b9b':shade(wall,-12),shade(wall,17));
      const fx=front-sign*.085;
      const floorH=height/p.stories,cols=clamp(Math.floor(width/2.7),1,6);
      for(let floor=0;floor<p.stories;floor++)for(let j=0;j<cols;j++){
         const zc=z1+(j+.5)*(z2-z1)/cols,door=floor===0&&j===Math.floor(cols/2),ww=Math.min(1.2,(z2-z1)/cols*.65),hh=door?2.15:1.55,cy=.2+floor*floorH+(door?1.05:floorH*.56);
         poly([[fx,cy-hh/2,zc-ww/2],[fx,cy-hh/2,zc+ww/2],[fx,cy+hh/2,zc+ww/2],[fx,cy+hh/2,zc-ww/2]],door?'#62594f':'#4b7885','#eee2c9',door?1.45:1.05);
      }
      if(kind==='haussmann'||kind==='victorian'||kind==='townhouse')cuboid(Math.min(front,outer)-.15,Math.max(front,outer)+.15,height-.43,height,z1+.03,z2-.03,roof,roof,shade(roof,15));
      if(kind==='haussmann')cuboid(Math.min(front,outer)+.4,Math.max(front,outer)-.4,height-1.35,height,z1+.3,z2-.3,roof,roof,shade(roof,10));
      if(p.stoop){for(let k=0;k<3;k++){const fx1=front-sign*(.2+k*.3);cuboid(Math.min(fx1,fx1+sign*.25),Math.max(fx1,fx1+sign*.25),.04,.14+k*.11,z+(width-1.8)/2,z+(width+1.8)/2,'#b8b1a3','#b8b1a3','#ddd4c2')}}
      if(p.lightwell&&p.setback>1){rect(front,front-sign*1.2,z+(width*.25),z+(width*.75),-.08,'#4f6362')}
      z+=width;
   }}
  draws.sort((a,b)=>b.d-a.d);for(const q of draws)q.draw();
  // A softly drawn horizon and light haze keep this diagrammatic rather than photorealistic.
  
  function selectedFace(pts){const v=pts.map(project);if(v.some(q=>!q))return;ctx.beginPath();ctx.moveTo(v[0][0],v[0][1]);for(let j=1;j<v.length;j++)ctx.lineTo(v[j][0],v[j][1]);ctx.closePath();ctx.fillStyle='rgba(254,177,59,.35)';ctx.fill();ctx.lineWidth=2.8;ctx.strokeStyle='#b75524';ctx.stroke();}
  if(tab==='street'&&data.lanes[selLane]){const lane=data.lanes[selLane];let xx=half-data.lanes.slice(0,selLane).reduce((sum,l)=>sum+l.w,0);selectedFace([[xx,.22,0],[xx-lane.w,.22,0],[xx-lane.w,.22,LENGTH],[xx,.22,LENGTH]]);}
  if(tab==='frontage'){const arr=data.frontages[side],i=selPlot[side],q=arr[i];if(q){const sign=side==='left'?1:-1,z0=arr.slice(0,i).reduce((sum,p)=>sum+p.w,0),z1=z0+q.w,edge=half*sign,front=edge+sign*(q.setback||0),h=q.stories*STOREY_HEIGHT;if(q.kind==='alley'||q.kind==='open')selectedFace([[edge,.2,z0],[edge+sign*8,.2,z0],[edge+sign*8,.2,z1],[edge,.2,z1]]);else {selectedFace([[front,.14,z0],[front,.14,z1],[front,h,z1],[front,h,z0]]);selectedFace([[front,h,z0],[front+sign*BUILDING_DEPTH,h,z0],[front+sign*BUILDING_DEPTH,h,z1],[front,h,z1]])}}}

  function shade(color,amount){let n=parseInt(color.slice(1),16);let r=clamp((n>>16)+amount,0,255)|0,g=clamp(((n>>8)&255)+amount,0,255)|0,b=clamp((n&255)+amount,0,255)|0;return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
  function billboard(x,y,z,r,color,oval=1){const q=project([x,y,z]);if(!q)return;const px=r*foc/q[2];draws.push({d:q[2]-.05,draw(){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(q[0],q[1],px,px*oval,0,0,Math.PI*2);ctx.fill()}})}
  function tree(x,z,type){const palette={plane:['#587d59','#729e6b'],lime:['#679564','#7eac73'],birch:['#96ae85','#b4c89d'],rowan:['#82a56c','#ac945d'],hornbeam:['#60865b','#8ca46c']}[type]||['#668e63','#85a879'];const y=type==='birch'?4.8:4.2;
    poly([[x-.11,.12,z],[x+.11,.12,z],[x+.13,y,z],[x-.13,y,z]],type==='birch'?'#e5e0d3':'#7f735c');
    for(let j=0;j<3;j++)billboard(x+Math.cos(j*2.4)*.66,y+.65+(j%2)*.6,z+Math.sin(j*2.4)*.7,1.5,palette[j%2],type==='birch'?1.2:.96);
  }
  function shrub(x,z,type){const c={box:'#648963',hawthorn:'#8a9c68',lavender:'#a6a0bd',dogwood:'#8e996b'}[type]||'#73916c';billboard(x,.5,z,type==='lavender'?.44:.62,c,.80)}
  function vehicle(x,z,len,big){const w=big?2.45:1.65,hh=big?2.8:1.2;
  cuboid(x-w/2,x+w/2,.14,.14+hh,z-len/2,z+len/2,big?'#ca7765':'#d9d5c8',big?'#a76452':'#b0b9b5','#96b5af');
  cuboid(x-w*.42,x+w*.42,.14+hh*.58,.14+hh*.86,z-len*.39,z+len*.39,'#6e9da2','#64898f','#899e9b')}
}

let timeout=0;function boot(){syncLabels();loadRemoteLibrary();refreshPanel(false);if(window.THREE)init3D();else{initFallback();timeout++;if(timeout<30)setTimeout(bootThree,300)}}function bootThree(){if(window.THREE){if(fallbackCanvas){fallbackCanvas.remove();fallbackCanvas=null}init3D()}else if(++timeout<30)setTimeout(bootThree,300)}boot();
</script>
